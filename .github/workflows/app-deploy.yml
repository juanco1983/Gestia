name: "🚀 App Deploy (EB)"

on:
  workflow_dispatch:
  push:
    branches: [dev, qa, main]
    paths-ignore:
      - 'infra/**'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "us-east-1"
  APP_NAME: "gestia-backend"
  S3_BUCKET: "elasticbeanstalk-us-east-1-325580897755"

jobs:
  build-and-deploy:
    name: Build & Deploy (${{ github.ref_name }})
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || '' }}

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Determinar ambiente EB
        id: env
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "eb_env=gestia-backend-prod" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" == "qa" ]]; then
            echo "eb_env=gestia-backend-qa" >> $GITHUB_OUTPUT
          else
            echo "eb_env=gestia-backend-dev" >> $GITHUB_OUTPUT
          fi

          # PWA (offline Técnico) se habilita en dev y qa; prod se mantiene apagado
          # hasta que el feature quede validado en esos ambientes.
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "pwa_flag=0" >> $GITHUB_OUTPUT
          else
            echo "pwa_flag=1" >> $GITHUB_OUTPUT
          fi

          # Generar un label único para la versión
          VERSION_LABEL="v-$(date +'%Y%m%d-%H%M%S')-${GITHUB_SHA::7}"
          echo "version_label=$VERSION_LABEL" >> $GITHUB_OUTPUT

      - name: Install Dependencies
        run: npm ci

      - name: Prisma Generate
        run: npx prisma generate

      - name: Build Application (Frontend + Backend)
        env:
          VITE_PWA_TECNICO: ${{ steps.env.outputs.pwa_flag }}
        run: npm run build

      - name: Prepare Deployment Package
        run: |
          mkdir eb-deploy-temp
          mkdir eb-deploy-temp/prisma
          
          # Copiar archivos compilados
          cp -r dist eb-deploy-temp/
          rm -f eb-deploy-temp/dist/backend-deploy.zip || true
          
          # Copiar esquema y configuraciones
          cp prisma/schema.prisma eb-deploy-temp/prisma/
          cp prisma.config.js eb-deploy-temp/ || true
          if [ -d ".ebextensions" ]; then cp -r .ebextensions eb-deploy-temp/; fi
          if [ -d ".platform" ]; then cp -r .platform eb-deploy-temp/; fi

          # Generar package.json de producción
          cat <<EOF > eb-deploy-temp/package.json
          {
            "name": "gestia-backend-prod",
            "version": "1.0.0",
            "private": true,
            "type": "module",
            "scripts": {
              "start": "node dist/server.cjs"
            },
            "dependencies": {
              "@aws-sdk/client-s3": "^3.712.0",
              "@aws-sdk/s3-request-presigner": "^3.712.0",
              "@google/genai": "^2.4.0",
              "@prisma/adapter-pg": "^7.8.0",
              "@prisma/client": "^7.8.0",
              "bcryptjs": "^3.0.3",
              "dotenv": "^17.2.3",
              "express": "^4.21.2",
              "jsonwebtoken": "^9.0.3",
              "pg": "^8.22.0",
              "prisma": "^7.8.0",
              "ubigeo-peru": "^2.0.2"
            }
          }
          EOF

          # Generar Procfile (inicio rápido para evitar timeout en EB healthcheck)
          echo "web: npx prisma generate && npx prisma db push --accept-data-loss && node dist/server.cjs" > eb-deploy-temp/Procfile

          # Comprimir en formato ZIP
          cd eb-deploy-temp
          zip -r ../deploy.zip .
          cd ..

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload Package to S3
        run: |
          aws s3 cp deploy.zip s3://${{ env.S3_BUCKET }}/${{ steps.env.outputs.version_label }}.zip

      - name: Create EB Application Version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name ${{ env.APP_NAME }} \
            --version-label ${{ steps.env.outputs.version_label }} \
            --source-bundle S3Bucket=${{ env.S3_BUCKET }},S3Key=${{ steps.env.outputs.version_label }}.zip

      - name: Deploy to Elastic Beanstalk Environment
        run: |
          ENV_NAME="${{ steps.env.outputs.eb_env }}"
          VERSION_LABEL="${{ steps.env.outputs.version_label }}"
          
          echo "Verificando estado del ambiente $ENV_NAME en Elastic Beanstalk..."
          ENV_STATUS=$(aws elasticbeanstalk describe-environments \
            --application-name "${{ env.APP_NAME }}" \
            --environment-names "$ENV_NAME" \
            --query "Environments[0].Status" \
            --output text 2>/dev/null || echo "None")
          
          if [ "$ENV_STATUS" != "None" ] && [ -n "$ENV_STATUS" ] && [ "$ENV_STATUS" != "Terminated" ]; then
            echo "El ambiente $ENV_NAME existe (Estado: $ENV_STATUS). Actualizando a la versión $VERSION_LABEL..."
            aws elasticbeanstalk update-environment \
              --environment-name "$ENV_NAME" \
              --version-label "$VERSION_LABEL"
          else
            echo "El ambiente $ENV_NAME no existe en AWS. Creando nuevo ambiente $ENV_NAME..."
            
            # Obtener Solution Stack compatible para Node.js 20 AL2023
            SOLUTION_STACK=$(aws elasticbeanstalk list-available-solution-stacks \
              --query "SolutionStacks[?contains(@, 'Node.js 20') && contains(@, 'Amazon Linux 2023')][0]" \
              --output text 2>/dev/null || echo "None")
            
            if [ -z "$SOLUTION_STACK" ] || [ "$SOLUTION_STACK" == "None" ]; then
              SOLUTION_STACK="64bit Amazon Linux 2023 v6.11.3 running Node.js 20"
            fi
            
            echo "Desplegando ambiente $ENV_NAME con Solution Stack: $SOLUTION_STACK"
            aws elasticbeanstalk create-environment \
              --application-name "${{ env.APP_NAME }}" \
              --environment-name "$ENV_NAME" \
              --version-label "$VERSION_LABEL" \
              --solution-stack-name "$SOLUTION_STACK" \
              --tier "Name=WebServer,Type=Standard" \
              --cname-prefix "$ENV_NAME" \
              --option-settings \
                  Namespace=aws:autoscaling:launchconfiguration,OptionName=InstanceType,Value=t3.micro \
                  Namespace=aws:autoscaling:launchconfiguration,OptionName=IamInstanceProfile,Value=aws-elasticbeanstalk-ec2-role \
                  Namespace=aws:elasticbeanstalk:environment,OptionName=EnvironmentType,Value=SingleInstance \
                  Namespace=aws:elasticbeanstalk:application:environment,OptionName=PORT,Value=5000 \
                  Namespace=aws:elasticbeanstalk:application:environment,OptionName=NODE_ENV,Value=production \
                  Namespace=aws:elasticbeanstalk:application:environment,OptionName=AWS_REGION,Value=us-east-1 \
              || aws elasticbeanstalk create-environment \
                  --application-name "${{ env.APP_NAME }}" \
                  --environment-name "$ENV_NAME" \
                  --version-label "$VERSION_LABEL" \
                  --solution-stack-name "$SOLUTION_STACK" \
                  --tier "Name=WebServer,Type=Standard" \
                  --option-settings \
                      Namespace=aws:autoscaling:launchconfiguration,OptionName=InstanceType,Value=t3.micro \
                      Namespace=aws:autoscaling:launchconfiguration,OptionName=IamInstanceProfile,Value=aws-elasticbeanstalk-ec2-role \
                      Namespace=aws:elasticbeanstalk:environment,OptionName=EnvironmentType,Value=SingleInstance \
                      Namespace=aws:elasticbeanstalk:application:environment,OptionName=PORT,Value=5000 \
                      Namespace=aws:elasticbeanstalk:application:environment,OptionName=NODE_ENV,Value=production \
                      Namespace=aws:elasticbeanstalk:application:environment,OptionName=AWS_REGION,Value=us-east-1
          fi
