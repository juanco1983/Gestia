name: "⚡ EC2 Power Control (Ahorro de Costos)"

# ─────────────────────────────────────────────────────────
#  Disparador: SOLO manual desde GitHub Actions UI.
#  En "Run workflow" aparecerá un formulario con:
#    • action  → STOP o START
#    • env     → dev, qa o prod
# ─────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      action:
        description: "Acción a ejecutar"
        required: true
        default: "STOP"
        type: choice
        options:
          - STOP
          - START
      environment:
        description: "Ambiente"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - qa
          - prod

permissions:
  contents: read

env:
  AWS_REGION: "us-east-1"
  EB_APP_NAME: "gestia-backend"

jobs:
  power-control:
    name: "${{ inputs.action }} EC2 · ${{ inputs.environment }}"
    runs-on: ubuntu-latest

    steps:
      # ── 1. Credenciales AWS ────────────────────────────────────────────────
      - name: "🔑 Configurar credenciales AWS"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ── 2. Obtener ASG e Instance-ID de Elastic Beanstalk ──────────────────
      - name: "🔍 Identificar recursos de Elastic Beanstalk"
        id: resources
        run: |
          EB_ENV="gestia-backend-${{ inputs.environment }}"
          echo "Identificando recursos del ambiente: $EB_ENV"

          # Obtener Auto Scaling Group Name
          ASG_NAME=$(aws autoscaling describe-auto-scaling-groups \
            --region "${{ env.AWS_REGION }}" \
            --query "AutoScalingGroups[?Tags[?Key=='elasticbeanstalk:environment-name' && Value=='$EB_ENV']]|[0].AutoScalingGroupName" \
            --output text)

          # Obtener Instance ID activo/detenido del ambiente
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:elasticbeanstalk:environment-name,Values=$EB_ENV" "Name=instance-state-name,Values=running,stopping,pending,stopped" \
            --region "${{ env.AWS_REGION }}" \
            --query "Reservations[*].Instances[*].InstanceId|[0]" \
            --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "❌ No se encontró ninguna instancia EC2 para el ambiente $EB_ENV"
            exit 1
          fi

          echo "✅ Auto Scaling Group: $ASG_NAME"
          echo "✅ EC2 Instance ID   : $INSTANCE_ID"

          echo "asg_name=$ASG_NAME" >> $GITHUB_OUTPUT
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "eb_env=$EB_ENV" >> $GITHUB_OUTPUT

      # ── 3. Consultar Estado Actual ─────────────────────────────────────────
      - name: "📊 Estado actual del EC2"
        run: |
          INSTANCE_ID="${{ steps.resources.outputs.instance_id }}"
          STATE=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --region "${{ env.AWS_REGION }}" \
            --query "Reservations[0].Instances[0].State.Name" \
            --output text)
          echo "Instancia $INSTANCE_ID está actualmente en estado: $STATE"

          if [ "${{ inputs.action }}" = "STOP" ] && [ "$STATE" = "stopped" ]; then
            echo "ℹ️  La instancia ya está detenida."
            exit 0
          fi
          if [ "${{ inputs.action }}" = "START" ] && [ "$STATE" = "running" ]; then
            echo "ℹ️  La instancia ya está corriendo."
            exit 0
          fi

      # ── 4A. APAGAR EC2 (Suspender Auto-Healing + Stop) ─────────────────────
      - name: "🛑 APAGAR EC2 (Suspender Auto-Healing y detener)"
        if: inputs.action == 'STOP'
        run: |
          ASG_NAME="${{ steps.resources.outputs.asg_name }}"
          INSTANCE_ID="${{ steps.resources.outputs.instance_id }}"

          echo "1. Suspendiendo procesos de Auto Scaling ($ASG_NAME) para evitar reemplazo automático..."
          aws autoscaling suspend-processes \
            --auto-scaling-group-name "$ASG_NAME" \
            --region "${{ env.AWS_REGION }}"

          echo "2. Apagando la instancia EC2 $INSTANCE_ID..."
          aws ec2 stop-instances --instance-ids "$INSTANCE_ID" --region "${{ env.AWS_REGION }}"

          echo "3. Esperando confirmación de estado stopped..."
          aws ec2 wait instance-stopped --instance-ids "$INSTANCE_ID" --region "${{ env.AWS_REGION }}"
          echo "✅ Instancia $INSTANCE_ID detenida exitosamente."
          echo ""
          echo "💰 AHORRO ACTIVO: La instancia está en estado stopped. Auto-Healing suspendido."
          echo "   0 cargos de cómputo EC2. Recuerda ejecutar START antes de realizar deploys."

      # ── 4B. ENCENDER EC2 (Reanudar Auto Scaling + Start) ────────────────────
      - name: "🟢 ENCENDER EC2 (Reanudar Auto Scaling e iniciar)"
        if: inputs.action == 'START'
        run: |
          ASG_NAME="${{ steps.resources.outputs.asg_name }}"
          INSTANCE_ID="${{ steps.resources.outputs.instance_id }}"

          echo "1. Reanudando procesos de Auto Scaling ($ASG_NAME)..."
          aws autoscaling resume-processes \
            --auto-scaling-group-name "$ASG_NAME" \
            --region "${{ env.AWS_REGION }}"

          echo "2. Iniciando la instancia EC2 $INSTANCE_ID..."
          aws ec2 start-instances --instance-ids "$INSTANCE_ID" --region "${{ env.AWS_REGION }}"

          echo "3. Esperando confirmación de estado running..."
          aws ec2 wait instance-running --instance-ids "$INSTANCE_ID" --region "${{ env.AWS_REGION }}"
          echo "✅ Instancia $INSTANCE_ID encendida exitosamente."

      # ── 5. Mostrar Estado Final ────────────────────────────────────────────
      - name: "📊 Estado final del EC2"
        if: always()
        run: |
          INSTANCE_ID="${{ steps.resources.outputs.instance_id }}"
          STATE=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --region "${{ env.AWS_REGION }}" \
            --query "Reservations[0].Instances[0].State.Name" \
            --output text 2>/dev/null || echo "Desconocido")

          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --region "${{ env.AWS_REGION }}" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text 2>/dev/null || echo "N/A")

          echo "───────────────────────────────────"
          echo "  Ambiente  : ${{ steps.resources.outputs.eb_env }}"
          echo "  Acción    : ${{ inputs.action }}"
          echo "  Instance  : $INSTANCE_ID"
          echo "  Estado EC2: $STATE"
          echo "  IP Pública: $PUBLIC_IP"
          echo "───────────────────────────────────"

      # ── 6. Aviso post-STOP ──────────────────────────────────────────────────
      - name: "⚠️  Aviso post-STOP"
        if: inputs.action == 'STOP'
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  ⚠️  IMPORTANTE: El pipeline de deploy (app-deploy.yml)"
          echo "  fallará si haces push mientras la instancia esté DETENIDA."
          echo "  Ejecuta este workflow con acción START antes de"
          echo "  hacer merge/deploy a ${{ inputs.environment }}."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
