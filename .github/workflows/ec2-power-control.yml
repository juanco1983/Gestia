name: "⚡ EC2 Power Control (Ahorro de Costos)"

# ─────────────────────────────────────────────────────────
#  Disparador: SOLO manual desde GitHub Actions UI.
#  En "Run workflow" aparecerá un formulario con:
#    • action  → STOP o START
#    • env     → dev o prod
# ─────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      action:
        description: "Acción a ejecutar"
        required: true
        default: "STOP"
        type: choice
        options:
          - STOP
          - START
      environment:
        description: "Ambiente"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read

env:
  AWS_REGION: "us-east-1"
  EB_APP_NAME: "gestia-backend"

jobs:
  power-control:
    name: "${{ inputs.action }} EC2 · ${{ inputs.environment }}"
    runs-on: ubuntu-latest

    # Proteger producción con un environment de GitHub que requiera aprobación
    environment: ${{ inputs.environment == 'prod' && 'production' || '' }}

    steps:
      # ── 1. Credenciales AWS ────────────────────────────────────────────────
      - name: "🔑 Configurar credenciales AWS"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ── 2. Determinar ambiente Elastic Beanstalk ───────────────────────────
      - name: "🔍 Identificar ambiente Elastic Beanstalk"
        id: eb_env
        run: |
          EB_ENV="gestia-backend-${{ inputs.environment }}"
          echo "eb_env=$EB_ENV" >> $GITHUB_OUTPUT
          echo "Operando sobre ambiente Beanstalk: $EB_ENV"

      # ── 3A. APAGAR EC2 (Capacidad = 0 en Elastic Beanstalk) ────────────────
      - name: "🛑 APAGAR EC2 (Reducir capacidad EB a 0)"
        if: inputs.action == 'STOP'
        run: |
          EB_ENV="${{ steps.eb_env.outputs.eb_env }}"
          echo "Ajustando capacidad de $EB_ENV a 0 instancias (Evita Auto-Healing)..."

          aws elasticbeanstalk update-environment \
            --environment-name "$EB_ENV" \
            --option-settings \
              Namespace=aws:autoscaling:asg,OptionName=MinSize,Value=0 \
              Namespace=aws:autoscaling:asg,OptionName=MaxSize,Value=0

          echo "Esperando actualización del ambiente..."
          aws elasticbeanstalk wait environment-updated --environment-name "$EB_ENV"
          echo "✅ Ambiente Beanstalk escalado a 0 instancias."
          echo ""
          echo "💰 AHORRO ACTIVO: 0 instancias EC2 corriendo. No hay cargos de cómputo."
          echo "   EBS y RDS siguen activos. Recuerda encender (START) antes de hacer deploy."

      # ── 3B. ENCENDER EC2 (Capacidad = 1 en Elastic Beanstalk) ───────────────
      - name: "🟢 ENCENDER EC2 (Restablecer capacidad EB a 1)"
        if: inputs.action == 'START'
        run: |
          EB_ENV="${{ steps.eb_env.outputs.eb_env }}"
          echo "Ajustando capacidad de $EB_ENV a 1 instancia..."

          aws elasticbeanstalk update-environment \
            --environment-name "$EB_ENV" \
            --option-settings \
              Namespace=aws:autoscaling:asg,OptionName=MinSize,Value=1 \
              Namespace=aws:autoscaling:asg,OptionName=MaxSize,Value=1

          echo "Esperando actualización del ambiente..."
          aws elasticbeanstalk wait environment-updated --environment-name "$EB_ENV"
          echo "✅ Instancia iniciada y ambiente en estado Ready."

      # ── 4. Mostrar estado FINAL del ambiente ───────────────────────────────
      - name: "📊 Estado final del ambiente"
        if: always()
        run: |
          EB_ENV="${{ steps.eb_env.outputs.eb_env }}"
          
          ENV_STATUS=$(aws elasticbeanstalk describe-environments \
            --environment-names "$EB_ENV" \
            --query "Environments[0].Status" \
            --output text 2>/dev/null || echo "Desconocido")

          ENV_HEALTH=$(aws elasticbeanstalk describe-environments \
            --environment-names "$EB_ENV" \
            --query "Environments[0].Health" \
            --output text 2>/dev/null || echo "Desconocido")

          INSTANCE_ID=$(aws elasticbeanstalk describe-environment-resources \
            --environment-name "$EB_ENV" \
            --query "EnvironmentResources.Instances[0].Id" \
            --output text 2>/dev/null || echo "Ninguna (0 instancias)")

          echo "───────────────────────────────────"
          echo "  Ambiente  : $EB_ENV"
          echo "  Acción    : ${{ inputs.action }}"
          echo "  Estado EB : $ENV_STATUS ($ENV_HEALTH)"
          echo "  EC2 ID    : $INSTANCE_ID"
          echo "───────────────────────────────────"

      # ── 5. Aviso post-STOP ──────────────────────────────────────────────────
      - name: "⚠️  Aviso post-STOP"
        if: inputs.action == 'STOP'
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  ⚠️  IMPORTANTE: El pipeline de deploy (app-deploy.yml)"
          echo "  fallará si haces push mientras el EC2 esté en 0 instancias."
          echo "  Ejecuta este workflow con acción START antes de"
          echo "  hacer merge/deploy a ${{ inputs.environment }}."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
