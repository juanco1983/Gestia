version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mafort-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mafort_secure_pass_2026
      POSTGRES_DB: mafort_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
