<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mockup Gestia - Ampliación de Fotos (Lightbox) en Auditoría</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Sora', 'sans-serif'],
            mono: ['IBM Plex Mono', 'monospace'],
          },
          colors: {
            teal: {
              brand: '#00B594',
              hover: '#00967a',
              light: '#E6F7F4',
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
  </style>
</head>
<body class="p-6 text-slate-100 antialiased flex items-center justify-center min-h-screen">

  <!-- LIGHTBOX MODAL OVERLAY (DEMO DE FOTO AMPLIADA) -->
  <div class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="max-w-3xl w-full bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
      
      <!-- Modal Header -->
      <div class="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-900/80">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-lg bg-teal-brand/10 text-teal-brand flex items-center justify-center">
            <i data-lucide="zoom-in" class="w-4 h-4"></i>
          </div>
          <div>
            <h3 class="text-sm font-bold text-slate-100">Visor de Evidencia Fotográfica</h3>
            <p class="text-xs text-slate-400 font-mono">Foto #2 de 18 · Medición de Entrada Multímetro</p>
          </div>
        </div>
        <button class="p-2 rounded-full hover:bg-slate-800 text-slate-400 hover:text-white transition-colors">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Photo Display Area -->
      <div class="flex-1 bg-black p-4 flex items-center justify-center overflow-hidden">
        <img src="https://images.unsplash.com/photo-1581092335397-9583fe92d232?auto=format&fit=crop&w=1200&q=90" alt="Evidencia Ampliada" class="max-h-[65vh] w-auto object-contain rounded-xl shadow-lg">
      </div>

      <!-- Footer Info -->
      <div class="p-4 border-t border-slate-800 bg-slate-900/80 flex items-center justify-between">
        <span class="text-xs text-slate-400 font-mono">INF-2026-OM-CO-001-4 · Medición comprobada 220V</span>
        <button class="px-4 py-2 bg-teal-brand hover:bg-teal-hover text-white text-xs font-bold font-mono rounded-xl transition-all flex items-center gap-2">
          <i data-lucide="check-circle-2" class="w-4 h-4"></i> Conforme
        </button>
      </div>

    </div>
  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
