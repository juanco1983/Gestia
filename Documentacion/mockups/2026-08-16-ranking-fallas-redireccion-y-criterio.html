<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mockup Gestia - Redirección Directa a Incidencias desde Ranking</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Sora', 'sans-serif'],
            mono: ['IBM Plex Mono', 'monospace'],
          },
          colors: {
            teal: {
              brand: '#00B594',
              hover: '#00967a',
              light: '#E6F7F4',
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
  </style>
</head>
<body class="p-6 text-slate-800 antialiased flex items-center justify-center min-h-screen">

  <div class="max-w-md w-full bg-white rounded-3xl border border-slate-100 p-6 shadow-sm space-y-4">
    
    <!-- Ranking Header -->
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <h3 class="text-sm font-extrabold text-slate-900 tracking-tight">Ranking de Equipos con Incidencias</h3>
        <span class="text-[10px] font-mono font-bold bg-rose-50 text-rose-600 border border-rose-200/60 px-2 py-0.5 rounded-full">Top 5</span>
      </div>
    </div>

    <!-- Info Banner -->
    <div class="p-3 bg-teal-light border border-teal-brand/20 rounded-2xl text-xs text-teal-800 flex items-center gap-2">
      <i data-lucide="mouse-pointer-click" class="w-4 h-4 text-teal-brand shrink-0"></i>
      <span><strong>Redirección Directa:</strong> Haz clic en cualquier equipo para ir a su historial completo de incidencias.</span>
    </div>

    <!-- Equipment Item 1 (Interactive Click) -->
    <div class="p-3.5 rounded-2xl bg-slate-50 border border-slate-200/80 flex items-center justify-between gap-3 hover:bg-teal-brand/5 hover:border-teal-brand/30 transition-all cursor-pointer group">
      <div class="flex items-center gap-3 min-w-0">
        <span class="text-base font-black font-mono text-rose-500 shrink-0">1.</span>
        <div class="min-w-0">
          <div class="flex items-baseline gap-1.5 truncate">
            <h4 className="text-xs font-black font-mono text-slate-900 truncate group-hover:text-teal-brand transition-colors">UPS 65kVA</h4>
            <span class="text-[10px] text-amber-600 font-bold font-mono">(Bypass Activo)</span>
          </div>
          <p class="text-[10px] text-slate-500 font-bold font-mono truncate mt-0.5">🏢 Omnia Medica SAC</p>
          <p class="text-[11px] text-rose-700 font-medium truncate mt-0.5">Batería descalibrada y ventilador con ruido crítico</p>
        </div>
      </div>

      <div class="flex flex-col items-end shrink-0">
        <span class="text-xs font-black font-mono text-rose-600">3 fallas</span>
        <span class="text-[9px] font-mono font-bold text-teal-brand group-hover:underline flex items-center gap-0.5 mt-1">
          Ver Incidencias <i data-lucide="arrow-right" class="w-3 h-3"></i>
        </span>
      </div>
    </div>

  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
