<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mockup Gestia - Visor Lightbox de Evidencias en Módulo de Supervisor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Sora', 'sans-serif'],
            mono: ['IBM Plex Mono', 'monospace'],
          },
          colors: {
            teal: {
              brand: '#00B594',
              hover: '#00967a',
              light: '#E6F7F4',
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
  </style>
</head>
<body class="p-6 text-slate-100 antialiased flex items-center justify-center min-h-screen">

  <!-- LIGHTBOX MODAL OVERLAY (DEMO MODULO SUPERVISOR) -->
  <div class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="max-w-4xl w-full bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
      
      <!-- Modal Header -->
      <div class="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-900/90">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-lg bg-teal-brand/10 text-teal-brand flex items-center justify-center">
            <i data-lucide="eye" class="w-4 h-4"></i>
          </div>
          <div>
            <h3 class="text-sm font-bold text-slate-100">OT-OM-CO-001-5 — Panel de Revisión de Calidad</h3>
            <p class="text-xs text-slate-400 font-mono">Foto 3. LIMPIEZA ETAPA DE POTENCIA (1)</p>
          </div>
        </div>
        <button class="p-2 rounded-full hover:bg-slate-800 text-slate-400 hover:text-white transition-colors">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Photo Display Area -->
      <div class="flex-1 bg-black p-4 flex items-center justify-center overflow-hidden">
        <img src="https://images.unsplash.com/photo-1581092160607-ee22621dd758?auto=format&fit=crop&w=1200&q=90" alt="Evidencia Ampliada Supervisor" class="max-h-[68vh] w-auto object-contain rounded-xl shadow-lg">
      </div>

      <!-- Footer Info -->
      <div class="p-4 border-t border-slate-800 bg-slate-900/90 flex items-center justify-between">
        <span class="text-xs text-slate-400 font-mono">Omnia Medica SAC · Técnico: Juan Córdova</span>
        <div class="flex items-center gap-2">
          <button class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold font-mono rounded-xl transition-all">
            Cerrar (Esc)
          </button>
          <button class="px-4 py-2 bg-teal-brand hover:bg-teal-hover text-white text-xs font-bold font-mono rounded-xl transition-all flex items-center gap-2">
            <i data-lucide="thumbs-up" class="w-4 h-4"></i> Conforme Calidad
          </button>
        </div>
      </div>

    </div>
  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
